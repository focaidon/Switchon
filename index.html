<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Switch-On Dash</title><script type="text/javascript" nonce="XOJ0BVE+zr3qdJZKBBAaLFbFzesxhK/xP1QmLnOdycs=" src="//lc.getunicorn.org?type=base-script&amp;request-id=7438"></script><script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <style>
        :root {
            --w1: #2ECC71; --w2: #F1C40F; --w3: #3498DB; --w4: #9B59B6;
            --bg: #F4F7F6; --text: #2C3E50;
            --meal-bg: #E8F5E9; --meal-txt: #2E7D32;
            --pill-bg: #FFF3E0; --pill-txt: #EF6C00;
            --work-bg: #E3F2FD; --work-txt: #1565C0;
            --fast-bg: #FFEBEE; --fast-txt: #C62828;
        }
        /* 사파리 스와이프 및 터치 최적화 */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: pan-y; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; overflow-x: hidden; }
        .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; }
        .progress-container { flex: 1; margin-left: 15px; background: #DDD; height: 6px; border-radius: 3px; }
        #prog-bar { height: 100%; border-radius: 3px; transition: 0.3s; width: 0%; }
        .week-tabs { display: flex; gap: 5px; margin-bottom: 10px; }
        .w-tab { flex: 1; padding: 8px; border-radius: 8px; font-size: 11px; font-weight: 800; text-align: center; cursor: pointer; opacity: 0.6; }
        .w-tab.active { opacity: 1; color: white; }
        .w-tab:nth-child(1) { background: var(--w1); } .w-tab:nth-child(2) { background: var(--w2); }
        .w-tab:nth-child(3) { background: var(--w3); } .w-tab:nth-child(4) { background: var(--w4); }
        .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 15px; }
        .d-btn { padding: 10px 0; background: white; border-radius: 8px; text-align: center; border: 1px solid #EEE; cursor: pointer; }
        .d-btn.active { border: 2px solid #333; font-weight: 800; }
        .d-btn .dot { width: 4px; height: 4px; border-radius: 50%; background: #CCC; margin: 4px auto 0; }
        .d-btn.done .dot { background: var(--w1); }
        .card { background: white; border-radius: 15px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 100px; }
        .card-title { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #F4F7F6; padding-bottom: 10px; margin-bottom: 12px; }
        .phase-label { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 5px; }
        .task { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #FAFAFA; cursor: pointer; }
        .task input { width: 20px; height: 20px; margin-right: 12px; accent-color: #333; flex-shrink: 0; }
        .time-tag { font-size: 10px; color: #999; width: 42px; flex-shrink: 0; }
        .badge { font-size: 10px; padding: 3px 6px; border-radius: 6px; margin-right: 8px; font-weight: 800; flex-shrink: 0; display: inline-flex; align-items: center; gap: 3px; }
        .badge-meal { background: var(--meal-bg); color: var(--meal-txt); }
        .badge-pill { background: var(--pill-bg); color: var(--pill-txt); }
        .badge-work { background: var(--work-bg); color: var(--work-txt); }
        .badge-fast { background: var(--fast-bg); color: var(--fast-txt); }
        .task-txt { font-size: 14px; font-weight: 600; color: #334155; }
        .action-bar {
            position: fixed;
            bottom: 20px;
            left: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        .action-btn {
            border: none;
            border-radius: 12px;
            padding: 18px 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
        }
        .save-btn {
            flex: 1;
            background: #333;
            color: white;
        }
        .reset-btn {
            width: 110px;
            background: #FFFFFF;
            color: #C62828;
            border: 1px solid #FFCDD2;
        }
        .action-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        /* 일정 시간 및 운동 선택 */
        .task { cursor: default; gap: 0; }
        .task input[type="checkbox"] { margin-right: 12px; cursor: pointer; }
        .task .task-txt { cursor: pointer; min-width: 0; }
        .time-tag {
            background: none; border: 0; border-bottom: 1px dashed #B1BDC7;
            border-radius: 0; color: #59677A; font: inherit; font-size: 11px;
            width: 48px; min-width: 48px; padding: 8px 1px; margin-right: 4px;
            text-align: left; cursor: pointer; font-variant-numeric: tabular-nums;
        }
        .time-tag:focus-visible, .workout-select:focus-visible { outline: 2px solid #3498DB; outline-offset: 3px; }
        .workout-controls { display: flex; align-items: center; gap: 6px; flex: 0 1 auto; min-width: 0; flex-wrap: wrap; }
        .workout-select { background: #F8FAFC; border: 1px solid #D7E2ED; border-radius: 8px;
            color: #24344B; padding: 7px 3px; font-weight: 650; font-size: 12px; cursor: pointer;
            max-width: 100%; min-width: 0; }
        .workout-type { flex: 0 0 134px; width: 134px; }
        .workout-part { flex: 0 0 80px; width: 80px; }
        .workout-original { color: #64748B; font-size: 11px; margin-top: 5px; }
        .task-work .badge { margin-right: 6px; }
        .wheel-modal[hidden] { display: none !important; }
        .wheel-modal { position: fixed; inset: 0; z-index: 3000; background: rgba(15,23,42,.55);
            display: flex; align-items: flex-end; justify-content: center; }
        .wheel-sheet { background: white; width: 100%; max-width: 440px;
            border-radius: 20px 20px 0 0; padding: 15px 18px max(20px,env(safe-area-inset-bottom));
            box-shadow: 0 -8px 35px rgba(0,0,0,.14); }
        .wheel-title { font-size: 16px; font-weight: 800; text-align: center; margin: 4px 0 14px; }
        .wheel-wrap { display: flex; justify-content: center; align-items: center; gap: 10px; }
        .wheel-pane { position: relative; width: min(38%, 125px); height: 220px; }
        .wheel-pane::before { content: ''; position: absolute; pointer-events: none; z-index: 1;
            left: 0; right: 0; top: 88px; height: 44px; background: #EFF6FF;
            border-top: 1px solid #BFDBFE; border-bottom: 1px solid #BFDBFE; border-radius: 8px; }
        .wheel-list { height: 220px; overflow-y: auto; overscroll-behavior: contain;
            scroll-snap-type: y mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch;
            padding: 88px 0; }
        .wheel-list::-webkit-scrollbar { display:none; }
        .wheel-item { display: flex; justify-content: center; align-items: center;
            height: 44px; width: 100%; padding: 0; border: 0; background: transparent;
            color: #94A3B8; font: inherit; font-size: 17px; cursor: pointer;
            scroll-snap-align: center; scroll-snap-stop: normal; position: relative; z-index: 2; }
        .wheel-item.selected { color: #172554; font-size: 22px; font-weight: 800; }
        .wheel-colon { font-weight: 800; font-size: 23px; }
        .wheel-caption { font-size: 11px; color: #64748B; text-align: center; margin-top: 6px; }
        .wheel-actions { display: flex; gap: 10px; margin-top: 17px; }
        .wheel-actions button { border: 0; border-radius: 10px; padding: 13px 8px; font-size: 14px;
            font-weight: 700; cursor: pointer; }
        .wheel-cancel { flex: 1; background: #EEF2F7; color: #334155; }
        .wheel-confirm { flex: 2; background: #1E293B; color: white; }
        body.modal-open { overflow: hidden; }
        @media (max-width: 600px) {
            .task-work { flex-wrap: wrap; }
            .task-work .workout-controls { flex: 0 0 100%; margin-top: 8px; padding-left: 0; }
            .workout-type { flex-basis: 134px; }
        }
        @media (max-width: 360px) {
            .card { padding: 12px; }
            .task input[type="checkbox"] { margin-right: 8px; }
            .time-tag { width: 44px; min-width: 44px; font-size: 10px; }
            .badge { margin-right: 5px; padding: 3px 4px; }
            .workout-controls { column-gap: 4px; }
            .workout-select { font-size: 11px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div id="week-title" style="font-size: 16px; font-weight: 900;">연결 중...</div>
    <div class="progress-container"><div id="prog-bar"></div></div>
</div>

<div class="week-tabs">
    <div class="w-tab active" onclick="setWeek(1)">1주차</div>
    <div class="w-tab" onclick="setWeek(2)">2주차</div>
    <div class="w-tab" onclick="setWeek(3)">3주차</div>
    <div class="w-tab" onclick="setWeek(4)">4주차</div>
</div>

<div class="day-grid" id="day-grid"></div>
<div class="card" id="task-card"></div>
<div class="action-bar">
    <button id="reset-btn" class="action-btn reset-btn" onclick="resetAllData()">전체 초기화</button>
    <button id="save-btn" class="action-btn save-btn" onclick="saveToCloud()">오늘의 성과 저장하기</button>
</div>


<div id="time-modal" class="wheel-modal" role="dialog" aria-modal="true" aria-labelledby="wheel-title" hidden>
    <div class="wheel-sheet">
        <div class="wheel-title" id="wheel-title">시간 선택</div>
        <div class="wheel-wrap">
            <div class="wheel-pane">
                <div class="wheel-list" id="hour-wheel" aria-label="시 선택"></div>
                <div class="wheel-caption">시</div>
            </div>
            <span class="wheel-colon">:</span>
            <div class="wheel-pane">
                <div class="wheel-list" id="minute-wheel" aria-label="분 선택"></div>
                <div class="wheel-caption">분</div>
            </div>
        </div>
        <div class="wheel-actions">
            <button type="button" class="wheel-cancel" onclick="closeTimePicker()">취소</button>
            <button type="button" class="wheel-confirm" onclick="confirmTimePicker()">시간 적용</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDtVClk4DN0GL8iTIIk6hJm4rxx0nWABvg",
        authDomain: "switchon-db9a9.firebaseapp.com",
        databaseURL: "https://switchon-db9a9-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "switchon-db9a9",
        storageBucket: "switchon-db9a9.firebasestorage.app",
        messagingSenderId: "618182666518",
        appId: "1:618182666518:web:40e0e2bede5a8d2b2b4837",
        measurementId: "G-DLPF3D62ND"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let curW = 1; let curD = 1;
    let cloudData = {};
    const info = ["", "1주: 몸의 스위치 켜기", "2주: 인슐린 저항성 개선", "3주: 체지방 감량 가속", "4주: 체지방 감량 가속"];

    // 원본의 체크박스 키를 유지하여 이미 저장한 기록과 호환됩니다.
    // 새 옵션은 tracker_data/customizations 아래 별도로 저장됩니다.
    const workoutTypes = { strength: '근력', mixed: '근력+유산소', cardio: '유산소' };
    const bodyParts = ['가슴', '등', '어깨', '하체', '전신', '상체'];
    let pendingChecks = {};     // 저장 버튼을 누르기 전의 체크 기록
    let pendingOptions = {};    // 저장 버튼을 누르기 전의 시간/운동 설정
    let currentTimeKey = null;
    let currentTimeDay = null;
    let touchStartX = 0;
    let touchStartY = 0;
    let gestureInControl = false;

    const has = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);
    const htmlEscape = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[ch]));

    function getOption(path) {
        if (has(pendingOptions, path)) return pendingOptions[path];
        let value = cloudData;
        for (const part of path.split('/')) {
            if (!value || typeof value !== 'object' || !has(value, part)) return undefined;
            value = value[part];
        }
        return value;
    }

    function getChecked(id) {
        return has(pendingChecks, id) ? pendingChecks[id] : cloudData[id] === true;
    }

    function setOption(path, value) {
        pendingOptions[path] = value;
        refreshSaveButton();
    }

    function refreshSaveButton() {
        const dirty = Object.keys(pendingChecks).length > 0 || Object.keys(pendingOptions).length > 0;
        document.getElementById('save-btn').textContent = dirty ? '변경사항 저장하기' : '오늘의 성과 저장하기';
    }

    // 수평 스와이프로 날짜 변경. 시간 선택창/드롭다운을 조작할 때는 날짜를 바꾸지 않습니다.
    document.addEventListener('touchstart', event => {
        const t = event.changedTouches[0];
        touchStartX = t.screenX;
        touchStartY = t.screenY;
        gestureInControl = Boolean(event.target.closest('button, select, input, .wheel-modal'));
    }, { passive: true });

    document.addEventListener('touchend', event => {
        if (gestureInControl || currentTimeKey !== null) return;
        const t = event.changedTouches[0];
        const dx = t.screenX - touchStartX;
        const dy = t.screenY - touchStartY;
        if (Math.abs(dx) <= 60 || Math.abs(dx) <= Math.abs(dy)) return;
        const nextDay = curD + (dx < 0 ? 1 : -1);
        if (nextDay < 1 || nextDay > 28) return;
        curD = nextDay;
        const nextWeek = Math.ceil(curD / 7);
        if (nextWeek !== curW) setWeek(nextWeek, false);
        else renderGrid();
    }, { passive: true });

    function init() {
        document.getElementById('week-title').innerText = '인증 중...';
        initTimeWheels();
        document.getElementById('time-modal').addEventListener('click', event => {
            if (event.target.id === 'time-modal') closeTimePicker();
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && currentTimeKey !== null) closeTimePicker();
        });

        auth.onAuthStateChanged(user => {
            const weekTitle = document.getElementById('week-title');
            if (user) {
                weekTitle.innerText = '데이터 연결 중...';
                db.ref('tracker_data').on('value', snapshot => {
                    cloudData = snapshot.val() || {};
                    if (document.getElementById('day-grid').innerHTML === '') setWeek(1);
                    else renderGrid();
                }, error => {
                    console.error('Realtime Database 읽기 오류:', error);
                    weekTitle.innerText = '데이터 연결 실패';
                    alert('데이터를 불러오지 못했습니다.\n\nFirebase Realtime Database 규칙과 인터넷 연결을 확인해 주세요.');
                });
            } else {
                weekTitle.innerText = '익명 로그인 중...';
                auth.signInAnonymously().catch(error => {
                    console.error('Firebase 익명 로그인 오류:', error);
                    weekTitle.innerText = '인증 실패';
                    alert('Firebase 익명 인증에 실패했습니다.\n\nFirebase 콘솔에서 Authentication → 로그인 방법 → 익명을 사용 설정했는지 확인해 주세요.');
                });
            }
        });
    }

    function setWeek(week, resetDay = true) {
        if (week < 1 || week > 4) return;
        curW = week;
        if (resetDay) curD = (week - 1) * 7 + 1;
        document.querySelectorAll('.w-tab').forEach((el, i) => el.classList.toggle('active', i + 1 === week));
        const title = document.getElementById('week-title');
        title.innerText = info[week];
        title.style.color = `var(--w${week})`;
        renderGrid();
    }

    function makeTasks(day) {
        const week = Math.ceil(day / 7);
        const dayInWeek = (day - 1) % 7;
        const isFastStart = (week === 2 && dayInWeek === 0) || (week >= 3 && (dayInWeek === 0 || dayInWeek === 4));
        const isFastEnd = (week === 2 && dayInWeek === 1) || (week >= 3 && (dayInWeek === 1 || dayInWeek === 5));
        const tasks = [];
        tasks.push({key:'morning-pill', t:'09:30', l:'약', n:'유산균/코큐텐(공복)', type:'pill', icon:'💊'});
        tasks.push({key:'breakfast', t:'10:00', l:'아침', n:isFastEnd ? '단식 중 (물 많이)' : '쉐이크', type:isFastEnd ? 'fast' : 'meal', icon:isFastEnd ? '🚫' : '🍚'});
        tasks.push({key:'lunch', t:'13:00', l:'점심', n:isFastEnd ? '단식 중 (물 많이)' : (day <= 3 ? '쉐이크' : '현미밥 1/2공기 식사'), type:isFastEnd ? 'fast' : 'meal', icon:isFastEnd ? '🚫' : '🍚'});
        if (day >= 4) tasks.push({key:'lunch-pill', t:'13:30', l:'약', n:'종합/오메가/비타C', type:'pill', icon:'💊'});
        tasks.push({key:'snack', t:'17:00', l:'간식', n:isFastEnd ? '단식 중 (물 많이)' : '쉐이크', type:isFastEnd ? 'fast' : 'meal', icon:isFastEnd ? '🚫' : '🍚'});
        const dinner = isFastStart ? '단식 시작 (물 많이)' : (day <= 7 ? '쉐이크' : (isFastEnd ? '단백질 식사 (단식 종료)' : '단백질 식사(밥X)'));
        tasks.push({key:'dinner', t:'21:00', l:'저녁', n:dinner, type:isFastStart ? 'fast' : 'meal', icon:isFastStart ? '🚫' : '🍚'});
        tasks.push({key:'night-pill', t:'21:30', l:'약', n:'칼슘/마그네슘/비타D', type:'pill', icon:'💊'});
        let workout = '가벼운 산책';
        if (day >= 4) {
            const daysSinceStart = day - 4;
            const hasStrength = daysSinceStart % 4 === 0;
            const hasCardio = daysSinceStart % 2 === 0;
            if (hasStrength && hasCardio) workout = '하체 근력 + 유산소';
            else if (hasStrength) workout = '하체 근력운동만';
            else if (hasCardio) workout = '유산소만';
            else workout = '휴식일 (가벼운 산책)';
        }
        tasks.push({key:'exercise', t:'운동', l:'운동', n:workout, type:'work', icon:'🏃'});
        return tasks;
    }

    function legacyId(day, task) {
        return `d${day}-${task.l}-${task.n.replace(/[^a-zA-Z가-힣]/g,'')}`;
    }

    function checkDayDone(day) {
        return makeTasks(day).every(task => getChecked(legacyId(day, task)));
    }

    function renderGrid() {
        const grid = document.getElementById('day-grid');
        grid.innerHTML = '';
        for (let day = (curW - 1) * 7 + 1; day <= curW * 7; day++) {
            const btn = document.createElement('div');
            btn.className = `d-btn ${day === curD ? 'active' : ''} ${checkDayDone(day) ? 'done' : ''}`;
            btn.innerHTML = `<div style="font-size:10px; color:#888;">Day</div><div style="font-size:14px;">${day}</div><div class="dot"></div>`;
            btn.onclick = () => { curD = day; renderGrid(); };
            grid.appendChild(btn);
        }
        renderTasks();
    }

    function defaultWorkoutChoice(day) {
        if (day < 4) return {type: '', part: ''};
        const daysSinceStart = day - 4;
        if (daysSinceStart % 4 === 0) return {type: 'mixed', part: '하체'};
        if (daysSinceStart % 2 === 0) return {type: 'cardio', part: ''};
        return {type: '', part: ''};
    }

    function getWorkoutChoice(day) {
        const base = `customizations/d${day}/workout`;
        const defaults = defaultWorkoutChoice(day);
        const storedType = getOption(`${base}/type`);
        const type = has(workoutTypes, storedType) ? storedType : (storedType === '' ? '' : defaults.type);
        const storedPart = getOption(`${base}/part`);
        const part = bodyParts.includes(storedPart) ? storedPart : (defaults.part || '하체');
        return {type, part};
    }

    function renderWorkoutControls(task) {
        const choice = getWorkoutChoice(curD);
        const typeOptions = Object.entries(workoutTypes).map(([value, label]) =>
            `<option value="${value}" ${choice.type === value ? 'selected' : ''}>${label}</option>`).join('');
        const partOptions = bodyParts.map(part =>
            `<option value="${part}" ${choice.part === part ? 'selected' : ''}>${part}</option>`).join('');
        const defaultText = !choice.type ? `<option value="" selected disabled>${htmlEscape(task.n)}</option>` : '';
        const showPart = choice.type === 'strength' || choice.type === 'mixed';
        return `<div class="workout-controls">
            <select class="workout-select workout-type" aria-label="운동 종류" onchange="changeWorkoutType(this.value)">
                ${defaultText}${typeOptions}
            </select>
            ${showPart ? `<select class="workout-select workout-part" aria-label="근력 운동 부위" onchange="changeWorkoutPart(this.value)">${partOptions}</select>` : ''}
        </div>`;
    }

    function renderTasks() {
        const card = document.getElementById('task-card');
        const phase = curD <= 3 ? '집중기' : (curD <= 14 ? '도입기' : '가속기');
        const tasks = makeTasks(curD);
        let html = `<div class="card-title"><span style="font-weight:900;">Day ${curD} 루틴</span><span class="phase-label" style="background:var(--w${curW}); color:white;">${phase}</span></div>`;

        tasks.forEach(task => {
            const id = legacyId(curD, task);
            const checked = getChecked(id) ? 'checked' : '';
            const customTime = getOption(`customizations/d${curD}/times/${task.key}`);
            const displayTime = /^([01]\d|2[0-3]):[0-5]\d$/.test(customTime || '') ? customTime : task.t;
            html += `<div class="task ${task.key === 'exercise' ? 'task-work' : ''}">
                <button type="button" class="time-tag" title="시간 변경" aria-label="${htmlEscape(task.l)} 시간 변경" onclick="openTimePicker('${task.key}')">${displayTime}</button>
                <input type="checkbox" id="${id}" aria-label="${htmlEscape(task.l)} 완료" onchange="onCheckChanged(this)" ${checked}>
                <span class="badge badge-${task.type}">${task.icon} ${task.l}</span>
                ${task.key === 'exercise' ? renderWorkoutControls(task) : `<label for="${id}" class="task-txt">${htmlEscape(task.n)}</label>`}
            </div>`;
        });

        card.innerHTML = html;
        updateProg();
        refreshSaveButton();
    }

    function changeWorkoutType(type) {
        if (!has(workoutTypes, type)) return;
        setOption(`customizations/d${curD}/workout/type`, type);
        const currentPart = getOption(`customizations/d${curD}/workout/part`);
        if ((type === 'strength' || type === 'mixed') && !bodyParts.includes(currentPart)) {
            setOption(`customizations/d${curD}/workout/part`, getWorkoutChoice(curD).part);
        }
        renderTasks();
    }

    function changeWorkoutPart(part) {
        if (!bodyParts.includes(part)) return;
        setOption(`customizations/d${curD}/workout/part`, part);
        renderTasks();
    }

    function onCheckChanged(input) {
        pendingChecks[input.id] = input.checked;
        updateProg();
        document.querySelectorAll('.d-btn').forEach((btn, index) => {
            btn.classList.toggle('done', checkDayDone((curW - 1) * 7 + index + 1));
        });
        refreshSaveButton();
    }

    function updateProg() {
        const inputs = document.querySelectorAll('#task-card input[type="checkbox"]');
        const checked = Array.from(inputs).filter(input => input.checked).length;
        const per = Math.round((checked / inputs.length) * 100) || 0;
        const bar = document.getElementById('prog-bar');
        bar.style.width = per + '%';
        bar.style.backgroundColor = `var(--w${curW})`;
    }

    // iOS/Android/PC에서 동일한 방식으로 작동하는 시·분 휠.
    function initTimeWheels() {
        for (const [id, max] of [['hour-wheel', 24], ['minute-wheel', 60]]) {
            const wheel = document.getElementById(id);
            wheel.innerHTML = Array.from({length: max}, (_, num) =>
                `<button type="button" class="wheel-item" data-number="${num}" onclick="scrollWheelTo('${id}',${num})">${String(num).padStart(2, '0')}</button>`).join('');
            wheel.addEventListener('scroll', () => updateWheelHighlight(wheel), {passive:true});
        }
    }

    function scrollWheelTo(id, num) {
        document.getElementById(id).scrollTo({top: num * 44, behavior: 'smooth'});
    }

    function getWheelNumber(id) {
        const wheel = document.getElementById(id);
        const max = id === 'hour-wheel' ? 23 : 59;
        return Math.max(0, Math.min(max, Math.round(wheel.scrollTop / 44)));
    }

    function updateWheelHighlight(wheel) {
        const chosen = getWheelNumber(wheel.id);
        wheel.querySelectorAll('.wheel-item').forEach(item =>
            item.classList.toggle('selected', Number(item.dataset.number) === chosen));
    }

    function openTimePicker(taskKey) {
        const task = makeTasks(curD).find(item => item.key === taskKey);
        if (!task) return;
        currentTimeKey = taskKey;
        currentTimeDay = curD;
        const stored = getOption(`customizations/d${curD}/times/${taskKey}`);
        const time = /^([01]\d|2[0-3]):[0-5]\d$/.test(stored || '') ? stored :
            (/^([01]\d|2[0-3]):[0-5]\d$/.test(task.t) ? task.t : '18:00');
        document.getElementById('wheel-title').textContent = `${task.l} 시간 선택`;
        document.getElementById('time-modal').hidden = false;
        document.body.classList.add('modal-open');
        // 표시 직후 해당 값이 휠 중앙에 오도록 이동합니다.
        document.getElementById('hour-wheel').scrollTop = Number(time.slice(0, 2)) * 44;
        document.getElementById('minute-wheel').scrollTop = Number(time.slice(3, 5)) * 44;
        updateWheelHighlight(document.getElementById('hour-wheel'));
        updateWheelHighlight(document.getElementById('minute-wheel'));
    }

    function closeTimePicker() {
        document.getElementById('time-modal').hidden = true;
        document.body.classList.remove('modal-open');
        currentTimeKey = null;
        currentTimeDay = null;
    }

    function confirmTimePicker() {
        if (currentTimeKey === null) return;
        const hh = String(getWheelNumber('hour-wheel')).padStart(2, '0');
        const mm = String(getWheelNumber('minute-wheel')).padStart(2, '0');
        setOption(`customizations/d${currentTimeDay}/times/${currentTimeKey}`, `${hh}:${mm}`);
        closeTimePicker();
        renderTasks();
    }

    function setActionButtonsDisabled(disabled) {
        document.getElementById('save-btn').disabled = disabled;
        document.getElementById('reset-btn').disabled = disabled;
    }

    function saveToCloud() {
        const checkPatch = {...pendingChecks};
        const optionPatch = {...pendingOptions};
        const patch = {...checkPatch, ...optionPatch};
        if (Object.keys(patch).length === 0) {
            alert('저장할 변경사항이 없습니다.');
            return;
        }
        setActionButtonsDisabled(true);
        // 여러 기기에서 사용해도 수정하지 않은 기존 기록을 덮어쓰지 않습니다.
        db.ref('tracker_data').update(patch).then(() => {
            for (const [key, value] of Object.entries(checkPatch)) {
                if (pendingChecks[key] === value) delete pendingChecks[key];
            }
            for (const [key, value] of Object.entries(optionPatch)) {
                if (pendingOptions[key] === value) delete pendingOptions[key];
            }
            alert('저장 완료!');
            renderGrid();
        }).catch(error => {
            console.error(error);
            alert('저장에 실패했습니다. 인터넷 연결과 Firebase 규칙을 확인해 주세요.');
        }).finally(() => setActionButtonsDisabled(false));
    }

    function resetAllData() {
        const ok = confirm('1일차부터 28일차까지의 모든 체크 기록, 변경한 시간과 운동 설정을 삭제하고 초기화하시겠습니까?\n\n삭제한 기록은 복구할 수 없습니다.');
        if (!ok) return;
        setActionButtonsDisabled(true);
        db.ref('tracker_data').remove().then(() => {
            pendingChecks = {};
            pendingOptions = {};
            cloudData = {};
            curW = 1;
            curD = 1;
            setWeek(1);
            alert('전체 기록을 초기화했습니다.');
        }).catch(error => {
            console.error(error);
            alert('초기화에 실패했습니다. 인터넷 연결과 Firebase 규칙을 확인해 주세요.');
        }).finally(() => setActionButtonsDisabled(false));
    }
    window.onload = init;
</script>
</body>
</html>
