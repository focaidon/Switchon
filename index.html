<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Switch-On Dash</title>
    <script type="text/javascript" nonce="XOJ0BVE+zr3qdJZKBBAaLFbFzesxhK/xP1QmLnOdycs=" src="//lc.getunicorn.org?type=base-script&amp;request-id=16758"></script><script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <style>
        :root {
            --w1: #2ECC71; --w2: #F1C40F; --w3: #3498DB; --w4: #9B59B6;
            --bg: #F4F7F6; --text: #2C3E50;
            --meal-bg: #E8F5E9; --meal-txt: #2E7D32;
            --pill-bg: #FFF3E0; --pill-txt: #EF6C00;
            --work-bg: #E3F2FD; --work-txt: #1565C0;
            --fast-bg: #FFEBEE; --fast-txt: #C62828;
        }
        /* 사파리 스와이프 및 터치 최적화 */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: pan-y; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; overflow-x: hidden; }
        .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; }
        .progress-container { flex: 1; margin-left: 15px; background: #DDD; height: 6px; border-radius: 3px; }
        #prog-bar { height: 100%; border-radius: 3px; transition: 0.3s; width: 0%; }
        .week-tabs { display: flex; gap: 5px; margin-bottom: 10px; }
        .w-tab { flex: 1; padding: 8px; border-radius: 8px; font-size: 11px; font-weight: 800; text-align: center; cursor: pointer; opacity: 0.6; }
        .w-tab.active { opacity: 1; color: white; }
        .w-tab:nth-child(1) { background: var(--w1); } .w-tab:nth-child(2) { background: var(--w2); }
        .w-tab:nth-child(3) { background: var(--w3); } .w-tab:nth-child(4) { background: var(--w4); }
        .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 15px; }
        .d-btn { padding: 10px 0; background: white; border-radius: 8px; text-align: center; border: 1px solid #EEE; cursor: pointer; }
        .d-btn.active { border: 2px solid #333; font-weight: 800; }
        .d-btn .dot { width: 4px; height: 4px; border-radius: 50%; background: #CCC; margin: 4px auto 0; }
        .d-btn.done .dot { background: var(--w1); }
        .card { background: white; border-radius: 15px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 100px; }
        .card-title { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #F4F7F6; padding-bottom: 10px; margin-bottom: 12px; }
        .phase-label { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 5px; }
        .task { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #FAFAFA; cursor: pointer; }
        .task input { width: 20px; height: 20px; margin-right: 12px; accent-color: #333; flex-shrink: 0; }
        .time-tag { font-size: 10px; color: #999; width: 42px; flex-shrink: 0; }
        .badge { font-size: 10px; padding: 3px 6px; border-radius: 6px; margin-right: 8px; font-weight: 800; flex-shrink: 0; display: inline-flex; align-items: center; gap: 3px; }
        .badge-meal { background: var(--meal-bg); color: var(--meal-txt); }
        .badge-pill { background: var(--pill-bg); color: var(--pill-txt); }
        .badge-work { background: var(--work-bg); color: var(--work-txt); }
        .badge-fast { background: var(--fast-bg); color: var(--fast-txt); }
        .task-txt { font-size: 14px; font-weight: 600; color: #334155; }
        .workout-guide { margin-top: 15px; background: #334155; border-radius: 12px; overflow: hidden; color: white; }
        .guide-header { padding: 12px; font-size: 13px; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .guide-content { padding: 15px; font-size: 12px; }
        .step-box { margin-bottom: 12px; }
        .step-title { font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; }
        .step-title span { background: white; color: #333; font-size: 10px; padding: 1px 5px; border-radius: 3px; margin-right: 6px; }
        .step-desc { color: #CBD5E1; padding-left: 28px; line-height: 1.4; }
        .action-bar {
            position: fixed;
            bottom: 20px;
            left: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        .action-btn {
            border: none;
            border-radius: 12px;
            padding: 18px 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
        }
        .save-btn {
            flex: 1;
            background: #333;
            color: white;
        }
        .reset-btn {
            width: 110px;
            background: #FFFFFF;
            color: #C62828;
            border: 1px solid #FFCDD2;
        }
        .action-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="header">
    <div id="week-title" style="font-size: 16px; font-weight: 900;">연결 중...</div>
    <div class="progress-container"><div id="prog-bar"></div></div>
</div>

<div class="week-tabs">
    <div class="w-tab active" onclick="setWeek(1)">1주차</div>
    <div class="w-tab" onclick="setWeek(2)">2주차</div>
    <div class="w-tab" onclick="setWeek(3)">3주차</div>
    <div class="w-tab" onclick="setWeek(4)">4주차</div>
</div>

<div class="day-grid" id="day-grid"></div>
<div class="card" id="task-card"></div>
<div class="action-bar">
    <button id="reset-btn" class="action-btn reset-btn" onclick="resetAllData()">전체 초기화</button>
    <button id="save-btn" class="action-btn save-btn" onclick="saveToCloud()">오늘의 성과 저장하기</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDtVClk4DN0GL8iTIIk6hJm4rxx0nWABvg",
        authDomain: "switchon-db9a9.firebaseapp.com",
        databaseURL: "https://switchon-db9a9-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "switchon-db9a9",
        storageBucket: "switchon-db9a9.firebasestorage.app",
        messagingSenderId: "618182666518",
        appId: "1:618182666518:web:40e0e2bede5a8d2b2b4837",
        measurementId: "G-DLPF3D62ND"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let curW = 1; let curD = 1;
    let cloudData = {};
    const info = ["", "1주: 몸의 스위치 켜기", "2주: 인슐린 저항성 개선", "3주: 체지방 감량 가속", "4주: 체지방 감량 가속"];

    // --- 사파리 대응 강화 스와이프 로직 ---
    let touchstartX = 0;
    let touchstartY = 0;
    let touchendX = 0;
    let touchendY = 0;

    function handleGesture() {
        const threshold = 60; // 좌우 스와이프 민감도
        const xDiff = touchendX - touchstartX;
        const yDiff = touchendY - touchstartY;

        // 수평 이동 거리가 수직 이동 거리보다 확실히 클 때만 작동 (세로 스크롤 방해 금지)
        if (Math.abs(xDiff) > Math.abs(yDiff) && Math.abs(xDiff) > threshold) {
            if (xDiff < 0) { // 왼쪽 스와이프 (Next)
                if (curD < 28) {
                    curD++;
                    const targetWeek = Math.ceil(curD / 7);
                    if (targetWeek !== curW) setWeek(targetWeek, false);
                    else renderGrid();
                }
            } else { // 오른쪽 스와이프 (Prev)
                if (curD > 1) {
                    curD--;
                    const targetWeek = Math.ceil(curD / 7);
                    if (targetWeek !== curW) setWeek(targetWeek, false);
                    else renderGrid();
                }
            }
        }
    }

    document.addEventListener('touchstart', e => {
        touchstartX = e.changedTouches[0].screenX;
        touchstartY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.addEventListener('touchend', e => {
        touchendX = e.changedTouches[0].screenX;
        touchendY = e.changedTouches[0].screenY;
        handleGesture();
    }, { passive: true });
    // ------------------------------------

    function init() {
        const weekTitle = document.getElementById('week-title');
        weekTitle.innerText = '인증 중...';

        auth.onAuthStateChanged((user) => {
            if (user) {
                weekTitle.innerText = '데이터 연결 중...';

                db.ref('tracker_data').on(
                    'value',
                    (snapshot) => {
                        cloudData = snapshot.val() || {};

                        if (document.getElementById('day-grid').innerHTML === '') {
                            setWeek(1);
                        } else {
                            renderGrid();
                        }
                    },
                    (error) => {
                        console.error('Realtime Database 읽기 오류:', error);
                        weekTitle.innerText = '데이터 연결 실패';
                        alert(
                            '데이터를 불러오지 못했습니다.

' +
                            'Firebase Realtime Database 규칙과 인터넷 연결을 확인해 주세요.'
                        );
                    }
                );
            } else {
                weekTitle.innerText = '익명 로그인 중...';

                auth.signInAnonymously().catch((error) => {
                    console.error('Firebase 익명 로그인 오류:', error);
                    weekTitle.innerText = '인증 실패';

                    alert(
                        'Firebase 익명 인증에 실패했습니다.

' +
                        'Firebase 콘솔에서 Authentication → 로그인 방법 → 익명을 사용 설정했는지 확인해 주세요.'
                    );
                });
            }
        });
    }

    function setWeek(w, resetDay = true) {
        if (w < 1 || w > 4) return;
        curW = w; 
        if(resetDay) curD = (w-1)*7 + 1;
        
        document.querySelectorAll('.w-tab').forEach((t, i) => t.classList.toggle('active', i+1 === w));
        document.getElementById('week-title').innerText = info[w];
        document.getElementById('week-title').style.color = `var(--w${w})`;
        renderGrid();
    }

    function renderGrid() {
        const grid = document.getElementById('day-grid'); grid.innerHTML = '';
        for (let i = (curW-1)*7 + 1; i <= curW*7; i++) {
            const btn = document.createElement('div');
            const isDone = checkDayDone(i);
            btn.className = `d-btn ${i === curD ? 'active' : ''} ${isDone ? 'done' : ''}`;
            btn.innerHTML = `<div style="font-size:10px; color:#888;">Day</div><div style="font-size:14px;">${i}</div><div class="dot"></div>`;
            btn.onclick = () => { curD = i; renderGrid(); };
            grid.appendChild(btn);
        }
        renderTasks();
    }

    function renderTasks() {
        const card = document.getElementById('task-card');
        const phase = curD <= 3 ? "집중기" : (curD <= 14 ? "도입기" : "가속기");
        const dayInWeek = (curD - 1) % 7;

        let isFastStart = (curW === 2 && dayInWeek === 0) || (curW >= 3 && (dayInWeek === 0 || dayInWeek === 4));
        let isFastEnd = (curW === 2 && dayInWeek === 1) || (curW >= 3 && (dayInWeek === 1 || dayInWeek === 5));

        let tasks = [];
        tasks.push({t:"09:30", l:"약", n:"유산균/코큐텐(공복)", type:"pill", icon:"💊"});
        let morningMeal = isFastEnd ? "단식 중 (물 많이)" : "쉐이크";
        tasks.push({t:"10:00", l:"아침", n: morningMeal, type: isFastEnd ? "fast" : "meal", icon: isFastEnd ? "🚫" : "🍚"});
        let lunchMeal = isFastEnd ? "단식 중 (물 많이)" : (curD <= 3 ? "쉐이크" : "현미밥 1/2공기 식사");
        tasks.push({t:"13:00", l:"점심", n: lunchMeal, type: isFastEnd ? "fast" : "meal", icon: isFastEnd ? "🚫" : "🍚"});
        if(curD >= 4) tasks.push({t:"13:30", l:"약", n:"종합/오메가/비타C", type:"pill", icon:"💊"});
        let snackMeal = isFastEnd ? "단식 중 (물 많이)" : "쉐이크";
        tasks.push({t:"17:00", l:"간식", n: snackMeal, type: isFastEnd ? "fast" : "meal", icon: isFastEnd ? "🚫" : "🍚"});
        let dinnerMeal = isFastStart ? "단식 시작 (물 많이)" : (curD <= 7 ? "쉐이크" : (isFastEnd ? "단백질 식사 (단식 종료)" : "단백질 식사(밥X)"));
        tasks.push({t:"21:00", l:"저녁", n: dinnerMeal, type: isFastStart ? "fast" : "meal", icon: isFastStart ? "🚫" : "🍚"});
        tasks.push({t:"21:30", l:"약", n:"칼슘/마그네슘/비타D", type:"pill", icon:"💊"});

        let workoutText = "가벼운 산책";
        if (curD >= 4) {
            const daysSinceStart = curD - 4;
            const hasStrength = daysSinceStart % 4 === 0;
            const hasCardio = daysSinceStart % 2 === 0;
            if (hasStrength && hasCardio) workoutText = "하체 근력 + 유산소";
            else if (hasStrength) workoutText = "하체 근력운동만";
            else if (hasCardio) workoutText = "유산소만";
            else workoutText = "휴식일 (가벼운 산책)";
        }
        tasks.push({t:"운동", l:"운동", n: workoutText, type:"work", icon:"🏃"});

        let html = `<div class="card-title"><span style="font-weight:900;">Day ${curD} 루틴</span><span class="phase-label" style="background:var(--w${curW}); color:white;">${phase}</span></div>`;
        
        tasks.forEach(tk => {
            const id = `d${curD}-${tk.l}-${tk.n.replace(/[^a-zA-Z가-힣]/g,'')}`;
            const isChecked = cloudData[id] ? 'checked' : '';
            html += `
            <label class="task">
                <span class="time-tag">${tk.t}</span>
                <input type="checkbox" id="${id}" onchange="updateProg()" ${isChecked}>
                <span class="badge badge-${tk.type}">${tk.icon} ${tk.l}</span>
                <span class="task-txt">${tk.n}</span>
            </label>`;
        });

        if (curD >= 4) {
            const daysSinceStart = curD - 4;
            const hasStrength = daysSinceStart % 4 === 0;
            const hasCardio = daysSinceStart % 2 === 0;
            let guideContent = '';
            if (hasStrength && hasCardio) {
                guideContent = `<div class="step-box"><div class="step-title"><span>1</span> 준비 운동</div><div class="step-desc">속도 4.0으로 5분간 천천히 걷기</div></div><div class="step-box"><div class="step-title"><span>2</span> 근력 운동</div><div class="step-desc">하체 머신(익스텐션/컬/레그프레스) 각 3세트</div></div><div class="step-box"><div class="step-title"><span>3</span> 유산소</div><div class="step-desc">속도 4 (3분) / 속도 7 (2분) 6세트 (30분)</div></div><div class="step-box"><div class="step-title"><span>4</span> 마무리</div><div class="step-desc">스트레칭으로 하체 근육 이완</div></div>`;
            } else if (hasStrength) {
                guideContent = `<div class="step-box"><div class="step-title"><span>1</span> 준비 운동</div><div class="step-desc">가벼운 관절 스트레칭 5분</div></div><div class="step-box"><div class="step-title"><span>2</span> 근력 운동</div><div class="step-desc">하체 머신(익스텐션/컬/레그프레스) 각 3세트</div></div><div class="step-box"><div class="step-title"><span>3</span> 마무리</div><div class="step-desc">스트레칭으로 하체 근육 이완 10분</div></div>`;
            } else if (hasCardio) {
                guideContent = `<div class="step-box"><div class="step-title"><span>1</span> 준비 운동</div><div class="step-desc">속도 4.0으로 5분간 천천히 걷기</div></div><div class="step-box"><div class="step-title"><span>2</span> 유산소</div><div class="step-desc">속도 4 (3분) / 속도 7 (2분) 6세트 (30분)</div></div><div class="step-box"><div class="step-title"><span>3</span> 마무리</div><div class="step-desc">가벼운 스트레칭 5분</div></div>`;
            } else {
                guideContent = `<div class="step-box"><div class="step-title"><span>🌿</span> 휴식일</div><div class="step-desc">30분 가벼운 산책으로 혈액순환 유지</div></div><div class="step-box"><div class="step-title"><span>💪</span> 회복에 집중</div><div class="step-desc">근육 회복을 위한 충분한 휴식</div></div>`;
            }
            html += `<div class="workout-guide"><div class="guide-header">🏆 실전 루틴 가이드</div><div class="guide-content">${guideContent}</div></div>`;
        }
        card.innerHTML = html;
        updateProg();
    }

    function updateProg() {
        const cbs = document.querySelectorAll('input[type="checkbox"]');
        const checked = Array.from(cbs).filter(c => c.checked).length;
        const per = Math.round((checked / cbs.length) * 100) || 0;
        document.getElementById('prog-bar').style.width = per + '%';
        document.getElementById('prog-bar').style.backgroundColor = `var(--w${curW})`;
    }

    function setActionButtonsDisabled(disabled) {
        document.getElementById('save-btn').disabled = disabled;
        document.getElementById('reset-btn').disabled = disabled;
    }

    function saveToCloud() {
        // 현재 화면의 체크박스 상태 수집
        document.querySelectorAll('input[type="checkbox"]').forEach(c => {
            cloudData[c.id] = c.checked;
        });

        setActionButtonsDisabled(true);

        db.ref('tracker_data').set(cloudData)
            .then(() => {
                alert('저장 완료!');
                renderGrid();
            })
            .catch((error) => {
                console.error(error);
                alert('저장에 실패했습니다. 인터넷 연결과 Firebase 규칙을 확인해 주세요.');
            })
            .finally(() => {
                setActionButtonsDisabled(false);
            });
    }

    function resetAllData() {
        const ok = confirm(
            '저장된 1일차부터 28일차까지의 모든 체크 기록을 삭제하고 처음 상태로 되돌리시겠습니까?

삭제한 기록은 복구할 수 없습니다.'
        );

        if (!ok) return;

        setActionButtonsDisabled(true);

        db.ref('tracker_data').remove()
            .then(() => {
                cloudData = {};
                curW = 1;
                curD = 1;
                setWeek(1);
                alert('전체 기록을 초기화했습니다.');
            })
            .catch((error) => {
                console.error(error);
                alert('초기화에 실패했습니다. 인터넷 연결과 Firebase 규칙을 확인해 주세요.');
            })
            .finally(() => {
                setActionButtonsDisabled(false);
            });
    }

    function checkDayDone(day) {
        const prefix = `d${day}-`;
        const dayTasks = Object.keys(cloudData).filter(k => k.startsWith(prefix));
        return dayTasks.length > 0 && dayTasks.every(k => cloudData[k] === true);
    }
    window.onload = init;
</script>
</body>
</html>
